name: Guide pêche – test des débits amont

on:
  workflow_dispatch:
  push:
    branches: [amont-test]
    paths: ["outils/amont_test.py", ".github/workflows/amont.yml"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python outils/amont_test.py
      - name: Enregistrer le résultat
        if: always()
        run: |
          git config user.name "guide-peche-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/amont
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Résultat du test amont"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
